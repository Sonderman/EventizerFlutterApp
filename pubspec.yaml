name: eventizer
description: "Create or join an event"
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 0.1.5+6

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  # -------------------- Firebase Integration --------------------
  firebase_core: ^4.13.0          # Firebase SDK'nın temel yapı taşı
  firebase_auth: ^6.5.7           # Kimlik doğrulama
  firebase_analytics: ^12.4.6      # Kullanıcı davranış analizi
  firebase_crashlytics: ^5.2.7      # Hata ve çökme raporlama
  cloud_firestore: ^6.8.0         # NoSQL veritabanı
  firebase_storage: ^13.4.6 

  # -------------------- UI & Navigation --------------------
  cupertino_icons: ^1.0.9           # dropdown_search 8.1.0 hâlâ ^1.0.9 istiyor — 2.0.0'a çıkamıyor
  fancy_bottom_navigation_2: ^0.3.5 # Bottom navigation bar
  font_awesome_flutter: ^11.0.0     # Font Awesome icons
  flutter_spinkit: ^5.2.2           # Loading animations
  simple_animations: ^5.3.0         # Animation utilities

  # -------------------- State Management --------------------
  provider: ^6.1.5+1                # State management solution
  get_it: ^9.2.1                    # Service locator
  get: ^4.7.3
  get_storage: ^2.1.1

  # -------------------- Image & Media --------------------
  image_picker: ^1.2.3              # Image selection from gallery/camera
  image_editor: ^1.6.0              # Image editing capabilities
  extended_image: ^10.1.0           # Advanced image widget

  # -------------------- Utilities --------------------
  dropdown_search: ^7.0.0           # 8.x material_ui paketine geçti — flutter/material kullanan projeyle uyumsuz
  url_launcher: ^6.3.2              # Launch URLs and external apps
  package_info_plus: ^10.2.1              # App package information
  fluttertoast: ^10.0.0            # Toast notifications
  store_redirect: ^2.0.4            # App store redirection
  intl: ^0.20.3                     # dash_chat_2 kaldırıldı — 0.20.x serbest
  sizer: ^3.1.3                     # Responsive design utility
  liquid_glass_widgets: ^1.8.1
  flex_color_scheme: ^8.4.0           # 9.x material_ui paketine geçti — flutter/material kullanan projeyle uyumsuz

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0             # Linting rules for better code quality

flutter:
  uses-material-design: true

  # -------------------- Assets --------------------
  assets:
    - assets/      # Application logo
    - assets/images/                 # Application images
    - assets/icons/                  # Application icons

  # -------------------- Fonts --------------------
  fonts:
    - family: IndieFlower
      fonts:
        - asset: assets/fonts/IndieFlower-Regular.ttf
    - family: Zona
      fonts:
        - asset: assets/fonts/ZonaPro-Bold.otf
    - family: ZonaLight
      fonts:
        - asset: assets/fonts/ZonaPro-ExtraLight.otf
