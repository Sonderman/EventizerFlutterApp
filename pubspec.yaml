name: eventizer
description: "Create or join an event"
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 0.1.5+6

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  # -------------------- Firebase Integration --------------------
  firebase_core: ^4.4.0          # Firebase SDK'nın temel yapı taşı
  firebase_auth: ^6.1.4           # Kimlik doğrulama
  firebase_analytics: ^12.1.2      # Kullanıcı davranış analizi
  firebase_crashlytics: ^5.0.7      # Hata ve çökme raporlama
  cloud_firestore: ^6.1.2         # NoSQL veritabanı
  firebase_storage: ^13.0.6 

  # -------------------- UI & Navigation --------------------
  cupertino_icons: ^1.0.8           # iOS style icons
  fancy_bottom_navigation_2: ^0.3.5 # Bottom navigation bar
  font_awesome_flutter: ^10.12.0     # Font Awesome icons
  flutter_spinkit: ^5.2.2           # Loading animations
  simple_animations: ^5.2.0         # Animation utilities

  # -------------------- State Management --------------------
  provider: ^6.1.5                  # State management solution
  get_it: ^9.2.1                    # Service locator
  get: ^4.7.3
  get_storage: ^2.1.1

  # -------------------- Image & Media --------------------
  image_picker: ^1.2.1              # Image selection from gallery/camera
  image_editor: ^1.6.0              # Image editing capabilities
  extended_image: ^10.0.1           # Advanced image widget

  # -------------------- Utilities --------------------
  dropdown_search: ^6.0.2           # Enhanced dropdown search
  url_launcher: ^6.3.2              # Launch URLs and external apps
  package_info_plus: ^9.0.0              # App package information
  fluttertoast: ^9.0.0            # Toast notifications
  store_redirect: ^2.0.4            # App store redirection
  intl: ^0.19.0                     # Internationalization
  sizer: ^3.0.5                     # Responsive design utility
  
  # -------------------- Chat & Communication --------------------
  dash_chat_2: ^0.0.21              # Chat interface components

  liquid_glass_renderer: ^0.2.0-dev.4
  flex_color_scheme: ^8.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0             # Linting rules for better code quality

flutter:
  uses-material-design: true

  # -------------------- Assets --------------------
  assets:
    - assets/images/                 # Application images
    - assets/icons/                  # Application icons

  # -------------------- Fonts --------------------
  fonts:
    - family: IndieFlower
      fonts:
        - asset: assets/fonts/IndieFlower-Regular.ttf
    - family: Zona
      fonts:
        - asset: assets/fonts/ZonaPro-Bold.otf
    - family: ZonaLight
      fonts:
        - asset: assets/fonts/ZonaPro-ExtraLight.otf